# Exploratory continuation authorized after v13 checkpoint recovery failed.
# This is not a member of the comparable Task-17 SSOD matrix and does not make
# a fixed-test or mAP acceptance claim.  Its Teacher is bound to a completed
# full-label v12n run and may pseudo-label only the independent Open Images pool.
experiment_name: ssod_exploratory_v12n_independent_openimages_seed42
model_config: ../models/yolov8m_1024.yaml
pretrained_weights: ${FRUIT_SSOD_ARTIFACT_ROOT}/runs/run-v12n-v8m-balanced-1024-ft40-seed42/weights/best.pt
artifact_root: ${FRUIT_SSOD_ARTIFACT_ROOT}
source_root: ${FRUIT_SSOD_DATA_ROOT}/fruit_ssod/processed/ssod_unlabeled_pool_fruits360_v2/image_root_materialized_v2
split_manifest: ${FRUIT_SSOD_DATA_ROOT}/fruit_ssod/manifests/ssod_independent_openimages_v13_v12n_teacher_seed42/split_manifest.json
human_images: ${FRUIT_SSOD_DATA_ROOT}/fruit_ssod/manifests/splits_v2/budgets/20/images.json
human_labels: ${FRUIT_SSOD_DATA_ROOT}/fruit_ssod/manifests/splits_v2/budgets/20/labels.json
validation_labels: ${FRUIT_SSOD_DATA_ROOT}/fruit_ssod/manifests/splits_v2/protected_splits/validation_labels.json
unlabeled_manifest: ${FRUIT_SSOD_DATA_ROOT}/fruit_ssod/manifests/ssod_independent_openimages_v13_v12n_teacher_seed42/unlabeled.json
candidates: ${FRUIT_SSOD_ARTIFACT_ROOT}/pseudo/ssod_v12n_independent_openimages_seed42/candidates.json
filter_audit: ${FRUIT_SSOD_ARTIFACT_ROOT}/pseudo/ssod_v12n_independent_openimages_seed42/filter_matrix/audit.jsonl
filter_decision_manifest: ${FRUIT_SSOD_ARTIFACT_ROOT}/pseudo/ssod_v12n_independent_openimages_seed42/filter_matrix/decision_manifest.json
pseudo_audit_report: ${FRUIT_SSOD_ARTIFACT_ROOT}/pseudo/ssod_v12n_independent_openimages_seed42/audit_report/pseudo_audit.json
seed: 42
label_budget_percent: 20
human_sample_probability: 0.5
sampling_strategy: balanced_50_50
initialization_policy:
  policy_id: external_teacher_self_training_v1
  model_initialization: teacher_checkpoint
  comparison_group: exploratory_v12n_independent_openimages_seed42
  teacher_experiment_config: v12_v8m_balanced_1024_finetune.yaml
  teacher_run_id: run-v12n-v8m-balanced-1024-ft40-seed42
  teacher_checkpoint: ${FRUIT_SSOD_ARTIFACT_ROOT}/runs/run-v12n-v8m-balanced-1024-ft40-seed42/weights/best.pt
  teacher_run_record: ${FRUIT_SSOD_ARTIFACT_ROOT}/runs/run-v12n-v8m-balanced-1024-ft40-seed42/run_record.json
epochs: 40
patience: 10
image_size: 1024
amp: true
batch: 2
device: cuda:0
filter_calibration:
  global_confidence: 0.50
  cross_view_iou: 0.60
  min_pixels_at_640: 16.0
  max_area_fraction: 0.90
  min_aspect_ratio: 0.10
  max_aspect_ratio: 10.0
  max_boxes_per_image: 20
  nms_iou: 0.60
  target_precision: 0.90
  threshold_minimum: 0.50
  threshold_maximum: 0.85
  validation_pr: ${FRUIT_SSOD_ARTIFACT_ROOT}/pseudo/ssod_v12n_independent_openimages_seed42/calibration/fixed_validation_pr.json
  aspect_ratio_bounds: ${FRUIT_SSOD_ARTIFACT_ROOT}/pseudo/ssod_v12n_independent_openimages_seed42/calibration/fixed_aspect_ratio_bounds.json
pseudo_filter:
  policy_id: trust_filter_v1
  use_per_class_thresholds: true
  require_view_consistency: true
  require_size_filter: true
