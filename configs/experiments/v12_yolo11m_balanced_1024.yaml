# Stage-3 architecture comparison. FRUIT_SSOD_PRETRAINED_WEIGHTS must be a
# separately downloaded and hashed official COCO-pretrained yolo11m.pt.
experiment_name: supervised_v12_yolo11m_balanced_1024_seed42
model_config: ../models/yolo11m_1024.yaml
dataset_yaml: ${FRUIT_SSOD_DATA_ROOT}/fruit_ssod/processed/yolo/supervised_v12n_full_label_balanced_seed42/dataset.yaml
split_manifest: ${FRUIT_SSOD_DATA_ROOT}/fruit_ssod/manifests/splits_v11_full_kaggle_zenodo_seed42/split_manifest.json
artifact_root: ${FRUIT_SSOD_ARTIFACT_ROOT}
seed: 42
epochs: 100
patience: 20
pretrained_weights: ${FRUIT_SSOD_PRETRAINED_WEIGHTS}
initialization_policy:
  policy_id: v12_yolo11m_coco_balanced_high_resolution_v1
  model_initialization: shared_pretrained_weights
  comparison_group: full_label_balanced_v12_seed42
model: yolo11m.yaml
image_size: 1024
amp: true
batch: 2
names: [Apple, Banana, Orange, Strawberry, Pineapple]
