# Expanded-source protocol: Open Images V7 plus the audited Snacks Detection
# supplement.  This is intentionally independent from the v2 reference matrix;
# its fixed split fingerprint must be used for every v4 comparison.
experiment_name: supervised_v4_expanded_20_seed42
model_config: ../models/yolov8s_640.yaml
dataset_yaml: ${FRUIT_SSOD_DATA_ROOT}/fruit_ssod/processed/yolo/supervised_v4_20_seed42/dataset.yaml
split_manifest: ${FRUIT_SSOD_DATA_ROOT}/fruit_ssod/manifests/splits_v4_expanded_source_seed42/split_manifest.json
artifact_root: ${FRUIT_SSOD_ARTIFACT_ROOT}
seed: 42
label_budget_percent: 20
epochs: 100
pretrained_weights: ${FRUIT_SSOD_PRETRAINED_WEIGHTS}
initialization_policy:
  policy_id: expanded_source_student_init_v1
  model_initialization: shared_pretrained_weights
  comparison_group: expanded_source_v4_seed42
