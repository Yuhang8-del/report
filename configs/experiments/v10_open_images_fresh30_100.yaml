# v10 upper reference: v8 sources plus 150 new, source-ID-disjoint Open Images
# training images. The project creates a new split; no v8 test images are reused.
experiment_name: supervised_v10_open_images_fresh30_100_seed42
model_config: ../models/yolov8s_640.yaml
dataset_yaml: ${FRUIT_SSOD_DATA_ROOT}/fruit_ssod/processed/yolo/supervised_v10_open_images_fresh30_100_seed42/dataset.yaml
split_manifest: ${FRUIT_SSOD_DATA_ROOT}/fruit_ssod/manifests/splits_v10_open_images_fresh30_seed42/split_manifest.json
artifact_root: ${FRUIT_SSOD_ARTIFACT_ROOT}
seed: 42
label_budget_percent: 100
epochs: 100
pretrained_weights: ${FRUIT_SSOD_PRETRAINED_WEIGHTS}
initialization_policy:
  policy_id: open_images_fresh30_expanded_source_student_init_v1
  model_initialization: shared_pretrained_weights
  comparison_group: open_images_fresh30_expanded_source_v10_seed42
