  teacher_run_record: E:/fruit_ssod_runtime/artifacts_v12/runs/run-v12n-v8m-balanced-1024-ft40-seed42/run_record.json
# Practical first-result schedule: the stronger Teacher supplies the quality;
# cap Student wall time so the exploratory result is produced promptly.
epochs: 40
patience: 10
learning_rate: 0.0001
optimizer: AdamW
cos_lr: true
close_mosaic: 15
mosaic: 1.0
mixup: 0.10
freeze: 0
save_period: 1
image_size: 768
amp: false
batch: 4
workers: 0
device: cuda:0
filter_calibration:
  global_confidence: 0.50
  cross_view_iou: 0.60
  min_pixels_at_640: 16.0
  max_area_fraction: 0.90
  min_aspect_ratio: 0.10
  max_aspect_ratio: 10.0
  max_boxes_per_image: 20
  nms_iou: 0.60
  target_precision: 0.70
  threshold_minimum: 0.50
  threshold_maximum: 0.85
  validation_pr: E:/fruit_ssod_runtime/artifacts_v15/calibration/supervised_v2_teacher_seed42/fixed_validation_pr.json
  aspect_ratio_bounds: E:/fruit_ssod_runtime/artifacts_v15/calibration/supervised_v2_teacher_seed42/fixed_aspect_ratio_bounds.json
pseudo_filter:
  policy_id: trust_filter_v1
  use_per_class_thresholds: true
  require_view_consistency: true
  require_size_filter: true
evaluation_protocol:
  protocol_id: first_result_validation_then_fixed_test
  split: test
  dataset_role: primary_fixed_test


